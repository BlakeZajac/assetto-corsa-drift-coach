[SETTINGS]
DISTANCE = 7 ; Distance behind the direction of travel; from 4 m to 16, round to 0.1
HEIGHT = 9 ; Height above the car; from 4 m to 18, round to 0.1
FOV = 60 ; Field of view; from 40 to 100, round to 1
LOOK_AHEAD = 2 ; Aim point ahead along the followed direction; from 0 m to 8, round to 0.1
TRAVEL_FOLLOW = 1 ; Follow travel direction instead of the nose (fades out when slow or reversing); from 0 to 1, perc.
SMOOTHING = 1 ; Smoothing multiplier (higher is slower); from 0.35 to 2.5, round to 0.05
HORIZON_LOCK = 0.98 ; Horizon stability (100% keeps the horizon level); from 0 to 1, perc.
__HINT_BOTTOM = Select this script in CSP chase camera settings. The shot stays behind the direction of travel, so a slide shows the car's side against the road. The far chase slot adds 2 m of distance and 1.5 m of height.
